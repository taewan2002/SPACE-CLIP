name: Controlled study checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check study code
        run: |
          ruff check scripts/layer_study scripts/multiseed scripts/component_study
          ruff format --check scripts/layer_study scripts/multiseed scripts/component_study
          python -m pytest -q scripts/layer_study scripts/multiseed scripts/component_study
      - name: Regenerate manuscript tables and figures from archived measurements
        run: |
          python -m scripts.layer_study.build_results
          python -m scripts.multiseed.build
          python -m scripts.component_study.build
